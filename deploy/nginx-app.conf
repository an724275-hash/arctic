root /usr/share/nginx/html;
index index.html;
server_tokens off;
client_max_body_size 32m;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;

location = /nginx-health { access_log off; return 200 'ok'; }
location = /materials { rewrite ^ /index.html last; }
location = /materials/ { rewrite ^ /index.html last; }
location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
location ~ /\. { deny all; }

# Docker DNS is resolved on each new connection after an API container replacement.
resolver 127.0.0.11 valid=10s ipv6=off;
set $arctic_api http://api:8000;
location /api/ {
    proxy_pass $arctic_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_request_buffering on;
}
location = /health/ready {
    proxy_pass $arctic_api$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /docs { return 404; }
location = /redoc { return 404; }
location = /openapi.json { return 404; }
location /assets/ {
    try_files $uri =404;
    expires 7d;
}
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
