name: Проверка версии

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: arctic
          POSTGRES_PASSWORD: ci-local-password
          POSTGRES_DB: arctic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arctic -d arctic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+psycopg://arctic:ci-local-password@localhost:5432/arctic_test
      DATABASE_URL: postgresql+psycopg://arctic:ci-local-password@localhost:5432/arctic_test
      CERTIFICATE_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q --junitxml=test-results.xml
